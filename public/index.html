<!doctype html>
<html lang="ja">
<head>

<title>パルクリール！ フランス蚤の市</title>
<meta name="description" content="パリの蚤の市を日付で確認して、同じ日に回れる組み合わせを探す">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9d4b6f2c">
</head>
<body>
<header class="top">
  <div class="top__inner">
    <h1 class="brand"><svg class="brand__icon" viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="brandMask"><rect width="100" height="100" fill="#fff"/><g fill="#000"><rect x="32" y="0" width="8" height="100"/><rect x="60" y="0" width="8" height="100"/><rect x="40" y="26" width="20" height="8"/><rect x="40" y="70" width="20" height="8"/></g></mask></defs><path d="M12 14 H88 L98 46 Q86 60 74 46 Q62 60 50 46 Q38 60 26 46 Q14 60 2 46 Z M14 60 H86 V94 H14 Z" fill="currentColor" mask="url(#brandMask)"/></svg>パルクリール！ フランス蚤の市</h1>
    <p class="top__sub">フランス蚤の市カレンダー：2027/1/1-2/28 ※時刻はフランス時間</p>
  </div>
  <nav class="days" id="days" aria-label="日付をえらぶ"></nav>
  <div class="tools">
    <div class="view" role="radiogroup" aria-label="表示">
      <button type="button" data-view="day" aria-pressed="true">この日</button>
      <button type="button" data-view="hashigo" aria-pressed="false">はしご</button>
      <button type="button" data-view="events" aria-pressed="false">単発</button>
      <button type="button" data-view="markets" aria-pressed="false">常設</button>
      <button type="button" data-view="saved" aria-pressed="false">★ メモ</button>
    </div>
    <div class="areawrap">
      <div class="areas" id="parisrow" role="group" aria-label="パリとエリア"></div>
      <div class="areas" id="regions" role="group" aria-label="パリ以外の地方"></div>
    </div>
    <button type="button" class="mapbtn" id="mapbtn" aria-expanded="false" aria-controls="frpanel" aria-label="フランスのどのあたりか、地図を開く" title="フランスのどのあたり？">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>
    </button>
    <div class="frpanel" id="frpanel" hidden role="dialog" aria-label="フランスのどのあたり？"></div>
  </div>
</header>

<main class="main" id="main" aria-live="polite"></main>

<footer class="foot">
  <p>単発の市は、パリ市が公開している一覧から日付と場所を載せています。<strong>出かける前に必ず主催者や公式の案内を確認してください。</strong></p>

</footer>

</html>
