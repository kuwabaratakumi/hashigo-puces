name: パリ市の一覧を取りこみ（月1回）

on:
  schedule:
    # 毎月1日 15:10（日本時間）。パリ市のページに負担をかけないよう、月に1回だけ取りに行く
    - cron: '10 6 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: hashigo-puces
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: パリ市の一覧を取りこむ（単発の市）
        run: node scripts/import-paris.mjs

      - name: データ作成（CSV → JSON）
        run: node scripts/build.mjs

      - name: 取りこみと日付のテスト
        run: node scripts/test.mjs

      - name: 変わっていたら保存する
        id: save
        run: |
          if git diff --quiet -- data/events.csv; then
            echo "一覧に変化なし（取りこみ日時だけ更新）"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "パリ市の一覧を取りこみ（月1回の自動）"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cloudflare Pages へ公開
        if: steps.save.outputs.changed == 'true'
        run: npx --yes wrangler@3 pages deploy public --project-name="$PROJECT" --branch=main --commit-dirty=true
